# StrCAD 현장조사 — Android APK build (GitHub Actions)
# push 하거나 Actions 탭에서 "Run workflow" 를 누르면 APK 가 만들어집니다.
name: build-apk
on:
  workflow_dispatch:
  push:
    paths: ["strcad_cad_analysis/mobile/**", "strcad_cad_analysis/android-app/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install & sync web app
        working-directory: strcad_cad_analysis/android-app
        run: |
          npm install --no-audit --no-fund
          npm run sync
      - name: Gradle assembleDebug
        working-directory: strcad_cad_analysis/android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp strcad_cad_analysis/android-app/android/app/build/outputs/apk/debug/app-debug.apk StrCAD_survey.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StrCAD_survey-apk
          path: StrCAD_survey.apk
      # 휴대폰에서 바로 받을 수 있게 Releases 에도 올림 (항상 최신 1개)
      - name: Publish release "apk-latest"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest StrCAD_survey.apk --title "StrCAD 현장조사 APK (최신)" \
            --notes "커밋 ${GITHUB_SHA::7} 에서 빌드된 디버그 APK. 휴대폰에서 받아 설치하세요." --target "$GITHUB_SHA" --latest=false
