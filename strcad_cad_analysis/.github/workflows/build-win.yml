name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ["cad_analysis/**", "mobile/**", "samples/**", "installer/**", "run_cad_analysis.py", ".github/workflows/build-win.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ezdxf pillow tkinterdnd2 pyinstaller

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path cad_analysis\__init__.py -Pattern '__version__ = "([0-9.]+)"').Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: PyInstaller
        run: >
          pyinstaller run_cad_analysis.py --noconfirm --clean --windowed --name StrCAD
          --icon cad_analysis/assets/icon.ico
          --add-data "cad_analysis/assets;cad_analysis/assets"
          --add-data "mobile;mobile"
          --add-data "samples;samples"
          --collect-all tkinterdnd2
          --collect-all ezdxf
          --hidden-import PIL._tkinter_finder

      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\StrCAD\StrCAD.exe -ArgumentList "--selftest","$PWD\selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if (Select-String -Path selftest.txt -Pattern "FAIL|MISSING") { exit 1 }

      - name: Inno Setup
        shell: pwsh
        run: |
          trap { Write-Host "::error::Inno step: $_"; exit 1 }
          function Find-Iscc {
            $c = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                   "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")
            $f = $c | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $f) { $g = Get-Command iscc.exe -ErrorAction SilentlyContinue; if ($g) { $f = $g.Source } }
            return $f
          }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Host; $iscc = Find-Iscc }
          if (-not $iscc) { Write-Host "::error::ISCC.exe not found"; exit 1 }
          Write-Host "ISCC: $iscc"
          $lang = Join-Path (Split-Path $iscc) "Languages\Korean.isl"
          if (-not (Test-Path $lang)) {
            Write-Host "Korean.isl not bundled - fetching"
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl" -OutFile installer\Korean.isl
            (Get-Content installer\strcad.iss -Raw) -replace 'compiler:Languages\\Korean.isl','Korean.isl' | Set-Content installer\strcad.iss -Encoding utf8BOM
          }
          $v = "${{ steps.ver.outputs.v }}"
          Set-Content installer\version.iss "#define AppVersion `"$v`"" -Encoding utf8
          Write-Host "version $v"
          Push-Location installer
          $out = & $iscc strcad.iss 2>&1
          Pop-Location
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) {
            $out | Select-Object -Last 8 | ForEach-Object { Write-Host "::error::ISCC $_" }
            exit $code
          }

      - uses: actions/upload-artifact@v4
        with:
          name: StrCAD_Setup_${{ steps.ver.outputs.v }}
          path: dist/StrCAD_Setup_*.exe

      - name: Publish release (win-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete win-latest --yes --cleanup-tag || true
          gh release create win-latest dist/StrCAD_Setup_*.exe --title "StrCAD Windows ${{ steps.ver.outputs.v }}" \
            --notes "StrCAD CAD Analysis ${{ steps.ver.outputs.v }} Windows 설치 파일" --latest=false
