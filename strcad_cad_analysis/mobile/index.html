<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1E2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="현장조사">
<title>StrCAD 현장조사</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="icon" id="btnMenu" aria-label="메뉴">☰</button>
    <img id="brand" src="logo.png" alt="">
    <div id="proj" class="ellipsis">파일을 여세요</div>
    <div id="pager">
      <button class="icon" id="pgPrev">‹</button>
      <span id="pgLbl">-/-</span>
      <button class="icon" id="pgNext">›</button>
    </div>
    <button class="pill" id="floorBtn">-</button>
    <button class="pill" id="btnSheets">도면LIST</button>
    <button class="pill insp" id="btnInsp">👤 검토자</button>
  </header>

  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="tools">
        <div class="seg" id="modeSeg">
          <button data-mode="view">보기</button>
          <button data-mode="point" class="on">검측점</button>
          <button data-mode="span">구간</button>
          <button data-mode="sketch">✎ 스케치</button>
        </div>
        <div class="seg" id="purposeSeg"></div>
        <div id="sketchBar" class="hidden">
          <div class="seg" id="skTools">
            <button data-tool="beam" class="on">━ 보</button>
            <button data-tool="column">■ 기둥</button>
            <button data-tool="wall">▬ 벽</button>
            <button data-tool="axis">⊕ 축</button>
            <button data-tool="free">〰 자유선</button>
            <button data-tool="text">A 글자</button>
            <button data-tool="erase">⌫ 지우기</button>
          </div>
          <div class="seg sk-colors" id="skColors"></div>
          <div class="seg"><button id="skUndo">↶ 되돌리기</button></div>
        </div>
        <button class="icon round" id="btnLayers" title="표시할 조사">👁</button>
        <button class="icon round" id="btnFit" title="전체보기">⛶</button>
      </div>
      <div id="hint"></div>
    </div>

    <aside id="panel" class="hidden">
      <div class="panel-head">
        <b>현장조사</b>
        <span id="editFlag"></span>
        <button class="icon" id="panelClose">✕</button>
      </div>
      <div id="pos"></div>
      <div id="form"></div>
    </aside>
  </div>

  <section id="list">
    <div class="list-head" id="listHead">
      <b>조사 목록</b> <span id="listCount"></span>
      <div id="filters"></div>
      <button class="icon" id="listDock" title="목록 위치">⇆</button>
      <button class="icon" id="listToggle">▾</button>
    </div>
    <div id="listBody"><table><thead id="lt-h"></thead><tbody id="lt-b"></tbody></table></div>
  </section>
</div>

<!-- empty state -->
<div id="welcome" class="modal show">
  <div class="sheet center">
    <img class="welcome-logo" src="logo.png" alt="StrCAD">
    <h2 class="welcome-title">StrCAD <span>현장조사</span></h2>
    <p class="welcome-sub">구조 부재 검측 · 배근 입력 · 간이 N.G 확인</p>
    <p>PC의 CAD Analysis에서 <b>현장조사 › 모바일로 내보내기</b>로 만든<br><b>.strsv</b> 파일을 열거나, 도면 없이 바로 시작하세요.</p>
    <label class="bigbtn">📂 조사 파일 열기<input type="file" id="fileOpen" hidden></label>
    <button class="bigbtn navy" id="btnNew">＋ 새 조사 (DXF 없이 · 빈 도면/사진)</button>
    <button class="bigbtn ghost hidden" id="btnResume">↺ 이어서 하기</button>
    <button class="bigbtn ghost hidden" id="btnPcGet">🖥 PC에서 받기</button>
    <p class="small" id="welcomeNote"></p>
    <p class="welcome-foot">© 2026 StrCAD</p>
  </div>
</div>

<div id="menu" class="modal">
  <div class="sheet">
    <h3>메뉴</h3>
    <label class="mi">📂 조사 파일 열기<input type="file" id="fileOpen2" hidden></label>
    <button class="mi" id="miSave">💾 저장 / 공유 (.strsv)</button>
    <button class="mi" id="miNew">＋ 도면 추가 (빈 도면 · 사진)</button>
    <button class="mi" id="miCalib">📏 축척 맞추기 (빈 도면 · 사진)</button>
    <button class="mi pc hidden" id="miPcGet">🖥 PC에서 받기</button>
    <button class="mi pc hidden" id="miPcPut">🖥 PC로 보내기</button>
    <button class="mi hidden" id="miPcAddr">⚙ PC 주소 설정 (Wi-Fi)</button>
    <button class="mi" id="miPurpose">＋ 용도 추가</button>
    <button class="mi" id="miCsv">📊 조사표 CSV</button>
    <button class="mi" id="miSketch">✎ 스케치 보이기 / 숨기기</button>
    <p class="small" id="menuInfo"></p>
    <button class="mi ghost" data-close>닫기</button>
  </div>
</div>

<div id="modal" class="modal"><div class="sheet" id="modalBody"></div></div>
<div id="toast"></div>

<script src="vendor/sql-wasm.js"></script>
<script src="check.js"></script>
<script src="app.js"></script>
<script src="detail.js"></script>
<script src="sketch.js"></script>
<script src="newsheet.js"></script>
</body>
</html>
